# CI：模板完整性验证——install → check → build（含字体子集化 + pagefind），
# 从零检出跑通即代表 Use this template 的用户开箱可用。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    name: Build (Node ${{ matrix.node }})
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm（版本读 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check（astro check）
        run: pnpm check

      - name: Build（astro build + 字体子集化 + pagefind 索引）
        run: pnpm build

      - name: Verify pagefind index
        run: test -f dist/pagefind/pagefind-entry.json && echo "pagefind index OK"
