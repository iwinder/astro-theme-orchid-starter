# 依赖自动升级：
# - @windcoder/*（主题）单独成组——主题发版后一周内自动开升级 PR，CI 绿即可合
# - 其余 npm 依赖 minor/patch 合并成一个 PR，减少噪音；major 独立成 PR 供人工评估
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      orchid-theme:
        patterns:
          - "@windcoder/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
